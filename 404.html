<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | JustiAid</title>
  <meta name="description" content="The page you're looking for couldn't be found. Return home or explore our legal services.">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="assets/images/logo.svg">

  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('theme'); } catch (e) {}
      if (!t) t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body data-page="404">
  <div class="aurora-bg" aria-hidden="true">
    <span class="wave w1"></span>
    <span class="wave w2"></span>
    <span class="wave w3"></span>
    <span class="wave w4"></span>
  </div>

  <div id="preloader" aria-hidden="true">
    <img class="preloader-paw" src="assets/images/logo.svg" alt="Loading">
  </div>

  <div id="navbar"></div>

  <main>
    <section class="center-page" aria-label="Error 404">
      <div class="paws-bg" aria-hidden="true">
        <span class="blob b1"></span>
        <span class="blob b2"></span>
      </div>
      <div class="container">
        <div class="reveal">
          <div class="big-404">404</div>
          <h1 class="mb-3">This page appears to be out of order</h1>
          <p class="text-muted mx-auto mb-4" style="max-width:480px">The page you're looking for was moved, renamed or never filed. Let's get you back on the right legal path.</p>
          <div class="d-flex flex-wrap gap-3 justify-content-center">
            <a class="btn btn-accent btn-lg" href="index.html"><i class="fa-solid fa-house"></i> Back to Home</a>
            <a class="btn btn-ghost btn-lg" href="services.html"><i class="fa-solid fa-scale-balanced"></i> Browse Practice Areas</a>
          </div>
          <div class="mt-5">
            <input class="field mx-auto" style="max-width:380px" type="search" placeholder="Search the site..." aria-label="Search the site">
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="footer"></div>

  <button class="back-top" id="backTop" type="button" aria-label="Back to top"><i class="fa-solid fa-arrow-up"></i></button>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/footer.js"></script>
  <script src="js/main.js"></script>
</body>

</html>
