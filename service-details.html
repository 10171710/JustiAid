<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Service Details | JustiAid</title>
  <meta name="description" content="Find a verified legal specialist and understand your options across family, property, criminal, corporate and consumer law.">
  <link rel="icon" type="image/svg+xml" href="assets/images/logo.svg">

  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('theme'); } catch (e) {}
      if (!t) t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body data-page="service-details">
  <div class="aurora-bg" aria-hidden="true">
    <span class="wave w1"></span>
    <span class="wave w2"></span>
    <span class="wave w3"></span>
    <span class="wave w4"></span>
  </div>

  <div id="preloader" aria-hidden="true">
    <img class="preloader-paw" src="assets/images/logo.svg" alt="Loading">
  </div>

  <div id="navbar"></div>

  <main>
    <section class="page-header sd-hero" aria-label="Service details">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-lg-8 text-center">
            <span class="sec-eyebrow reveal"><i class="fa-solid fa-gavel"></i> Practice area</span>
            <h1 class="reveal" data-sd-title>Family Law</h1>
            <p class="text-muted reveal reveal-delay-1" style="max-width:560px;margin-inline:auto" data-sd-tagline></p>
            <nav aria-label="breadcrumb">
              <ol class="breadcrumb reveal justify-content-center">
                <li class="breadcrumb-item"><a href="index.html">Home</a></li>
                <li class="breadcrumb-item"><a href="services.html">Services</a></li>
                <li class="breadcrumb-item active" data-sd-crumb>Family Law</li>
              </ol>
            </nav>
          </div>
        </div>
      </div>
    </section>

    <section class="section pt-2">
      <div class="container">
        <div class="row">
          <div class="col-lg-8">
            <div class="card-neu p-4 p-lg-5">
              <span class="icon-box mb-3" data-sd-icon><i class="fa-solid fa-scale-balanced"></i></span>
              <h2 class="h3 mb-3" data-sd-heading></h2>
              <p data-sd-p1></p>
              <p data-sd-p2></p>

              <h3 class="h5 mt-4 mb-3">What's included</h3>
              <div class="row g-3" data-sd-includes></div>

              <h3 class="h5 mt-4 mb-3">Typical process</h3>
              <ol class="mb-0" data-sd-process></ol>

              <div class="neu-inset p-4 my-4 rounded-4">
                <p class="mb-0" data-sd-init></p>
              </div>
            </div>
          </div>
          <div class="col-lg-4">
            <aside class="card-neu p-4 reveal">
              <h3 class="h5 mb-3"><i class="fa-solid fa-tags me-2" style="color:var(--accent)"></i>Fee ranges</h3>
              <ul class="list-unstyled small" data-sd-fees></ul>
              <h3 class="h5 mt-4 mb-2"><i class="fa-solid fa-circle-check me-2" style="color:var(--accent)"></i>Good to know</h3>
              <ul class="list-unstyled small text-muted" data-sd-notes></ul>
              <a class="btn btn-accent w-100 mt-3" href="contact.html#enquiry"><i class="fa-solid fa-file-lines"></i> Start a Case Enquiry</a>
              <a class="btn btn-ghost w-100 mt-2" href="#" data-sd-advocate><i class="fa-solid fa-user-tie"></i> Find an Advocate</a>
            </aside>

            <aside class="card-neu p-4 mt-4 reveal" style="background:var(--accent-soft)">
              <h3 class="h5 mb-3" style="color:var(--accent)"><i class="fa-solid fa-question me-2"></i>Related practice areas</h3>
              <ul class="list-unstyled small" data-sd-related></ul>
            </aside>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="footer"></div>

  <button class="back-top" id="backTop" type="button" aria-label="Back to top"><i class="fa-solid fa-arrow-up"></i></button>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/footer.js"></script>
  <script src="js/main.js"></script>
  <script src="js/service-details.js"></script>
</body>

</html>
